# Continuous integration -- the reusable ci workflow runs the canonical mise tasks
# (lint, build, test) as one job each, with Go, ffmpeg and every dev CLI installed
# from the mise pins (root mise.toml + the .mise/ toolchain submodule), and uploads
# the test coverage to Codecov.
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: bitwise-media-group/github-workflows/.github/workflows/ci.yaml@67215effe1e541e699905fb62b7a48b7293f935c # v8.3.0
