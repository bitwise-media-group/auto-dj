# Companion to merge.yaml: completes on an approving review so its
# workflow_run(completed) re-enters merge.yaml in base context, which is what lets an
# approval (fork or same-repo) finish an armed auto-merge.
name: Merge Review Ack

on:
  pull_request_review:
    types: [submitted]

# does no privileged work; grants nothing
permissions: {}

jobs:
  ack:
    uses: bitwise-media-group/github-workflows/.github/workflows/merge-review-ack.yaml@35d8e9a1ce772f67f97e73484dc5b7a50c29e0f3 # v8.1.1
