# CodeQL -- the actions language (build-free); there is no go.mod or package.json
# here, so detection adds no other leg. Runs on macOS (runs-on) like the other
# workflows; the zizmor job stays on Linux (a container action).
name: Security Analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "28 20 * * 4"

permissions:
  # upload analysis results to code scanning
  security-events: write
  # fetch internal or private CodeQL packs
  packages: read
  # only required for workflows in private repositories
  actions: read
  # check out the repository
  contents: read

jobs:
  analyze:
    uses: bitwise-media-group/github-workflows/.github/workflows/security.yaml@35d8e9a1ce772f67f97e73484dc5b7a50c29e0f3 # v8.1.1
    with:
      runs-on: macos-latest
