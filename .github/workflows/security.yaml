# CodeQL -- actions always, plus go (autobuild with the mise-pinned Go) from the
# root go.mod.
name: Security Analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "28 20 * * 4"

permissions:
  # upload analysis results to code scanning
  security-events: write
  # fetch internal or private CodeQL packs
  packages: read
  # only required for workflows in private repositories
  actions: read
  # check out the repository
  contents: read

jobs:
  analyze:
    uses: bitwise-media-group/github-workflows/.github/workflows/security.yaml@67215effe1e541e699905fb62b7a48b7293f935c # v8.3.0
