#
# auto-dj consumes the shared toolchain (bitwise-media-group/toolchain) as the
# .mise/ submodule: mise loads its config.toml natively as .mise/config.toml
# (pinned tools -- bun, markdownlint, addlicense, shellcheck, actionlint,
# zizmor, uv, ... -- and the [vars] knob defaults). Like glyph, this repo
# includes common only and carries its Swift build/test/fmt/lint, the Xcode
# gen/app-* tasks, the auto-dj CLI tasks and the docs site (plus the rollups
# that wire them in) in tasks.toml, included LAST so its same-named tasks win
# over common's. The Makefile is a thin forwarder (.mise/common/include.mk).
#
# Swift is pinned here, so `swift build`, `swift test` and `swift format`
# (which ships with the toolchain) are the same everywhere. AutoDJKit uses
# Apple frameworks, so it builds against the Xcode SDK on macOS only.

[task_config]
includes = [".mise/common/tasks.toml", "tasks.toml"] # common first, repo-local Swift + Xcode tasks last

[tools]
# swift.org toolchain (ADR 0018), built against the Xcode SDK.
"core:swift" = "6.4.2"
# Generates AutoDJ.xcodeproj from project.yml (`mise run gen`). macOS only:
# XcodeGen ships no Linux build, and the Linux CI jobs don't need it.
"aqua:yonaskolb/XcodeGen" = { version = "2.46.0", os = ["macos"] }
