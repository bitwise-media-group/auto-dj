#
# auto-dj consumes the shared toolchain (bitwise-media-group/toolchain) as the
# .mise/ submodule: pinned tools come from its config.toml (loaded natively as
# .mise/config.toml), the shared tasks from common/ and the go archetype
# (golangci-lint, govulncheck, gotestsum, the version-stamped build), and the
# Makefile is a thin forwarder (.mise/archetypes/go/include.mk). The Go runtime
# and govulncheck are pinned below; ffmpeg decodes the audio.
#
# The repo-local tasks below build and run the auto-dj CLI. Arguments after the
# task name are passed through to the CLI, so these are equivalent:
#   mise run set "Melodic Set" --preview-dir ~/Desktop
#   auto-dj set "Melodic Set" --preview-dir ~/Desktop
# They run in the invoking directory (so relative --out/--plan paths behave
# like a plain CLI call) against a fresh build of this checkout.

[tools]
go = "1.27.4"
# The Swift rewrite (ADR 0018): swift.org toolchain, built against the Xcode SDK.
"core:swift" = "6.4.2"
# Generates AutoDJ.xcodeproj from project.yml (`mise run gen`).
"aqua:yonaskolb/XcodeGen" = { version = "2.46.0", os = ["macos"] }
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"
"conda:ffmpeg" = "latest"

[vars]
app = "auto-dj"
app_pkg = "./cmd/auto-dj"

[task_config]
includes = [".mise/common/tasks.toml", ".mise/archetypes/go/tasks.toml"]  # common first, archetype second

[tasks.cue]
description = "run the auto-dj CLI with any arguments (mise run cue -- --help)"
dir = "{{cwd}}"
run = 'go build -C "{{config_root}}" -o auto-dj ./cmd/auto-dj && "{{config_root}}/auto-dj"'

[tasks.status]
description = "tracks per state; is Rekordbox running?"
dir = "{{cwd}}"
run = 'go build -C "{{config_root}}" -o auto-dj ./cmd/auto-dj && "{{config_root}}/auto-dj" status'

[tasks.features]
description = "decode audio once (cached in ~/.cache/auto-dj)"
dir = "{{cwd}}"
run = 'go build -C "{{config_root}}" -o auto-dj ./cmd/auto-dj && "{{config_root}}/auto-dj" features'

[tasks.evaluate]
description = "score the rules against your rated tracks [-v]"
dir = "{{cwd}}"
run = 'go build -C "{{config_root}}" -o auto-dj ./cmd/auto-dj && "{{config_root}}/auto-dj" evaluate'

[tasks.plan]
description = "plan cues for MIK / CUE(Auto) / no-hot-cue tracks [--categories ...]"
dir = "{{cwd}}"
run = 'go build -C "{{config_root}}" -o auto-dj ./cmd/auto-dj && "{{config_root}}/auto-dj" plan'

[tasks.review]
description = "render the HTML review page for the current plan"
dir = "{{cwd}}"
run = 'go build -C "{{config_root}}" -o auto-dj ./cmd/auto-dj && "{{config_root}}/auto-dj" review'

[tasks.apply]
description = "apply the plan: dry run, or --write with Rekordbox quit [--only ...]"
dir = "{{cwd}}"
run = 'go build -C "{{config_root}}" -o auto-dj ./cmd/auto-dj && "{{config_root}}/auto-dj" apply'

[tasks.set]
description = "prepare a set from a playlist: \"<playlist>\" [--order ...] [--preview-dir DIR] [--write]"
dir = "{{cwd}}"
run = 'go build -C "{{config_root}}" -o auto-dj ./cmd/auto-dj && "{{config_root}}/auto-dj" set'

[tasks.history]
description = "list the play histories, or one history's tracks [\"<history>\"]"
dir = "{{cwd}}"
run = 'go build -C "{{config_root}}" -o auto-dj ./cmd/auto-dj && "{{config_root}}/auto-dj" history'

[tasks.recording]
description = "split a set recording into tagged AAC tracks: \"<history>\" <mix.wav> --dj NAME --art COVER [--write]"
dir = "{{cwd}}"
run = 'go build -C "{{config_root}}" -o auto-dj ./cmd/auto-dj && "{{config_root}}/auto-dj" recording'

[tasks.demo]
description = "render the demo set, cue it, plan the set and open its preview [DIR]"
dir = "{{cwd}}"
run = 'go build -C "{{config_root}}" -o auto-dj ./cmd/auto-dj && "{{config_root}}/auto-dj" demo'

# The docs site (zensical.toml + docs/, Zensical via uv; the go archetype supplies `sync`).
# The walkthrough pages include what `auto-dj demo` prints and link its preview page, so
# every docs entry point regenerates them first: the AIFFs go to build/demo/ (never into
# the site), the fragments and preview to docs/demo/ (git-ignored). Skipped while the Go
# sources are unchanged.
[tasks.docs-demo]
hide = true
dir = "{{config_root}}"
sources = ["go.mod", "go.sum", "cmd/**/*.go", "internal/**/*.go", "internal/review/templates/*.html"]
outputs = ["docs/demo/preview/index.html"]
run = "go build -o auto-dj ./cmd/auto-dj && ./auto-dj demo docs/demo --tracks build/demo/tracks --no-open"

[tasks.docs-build]
description = "build the documentation site (demo walkthrough + zensical)"
dir = "{{config_root}}"
depends = ["sync"]
run = [{ task = "docs-demo" }, "uv run --no-sync zensical build"]

[tasks.serve]
description = "serve the docs site locally on :8004 (zensical)"
dir = "{{config_root}}"
depends = ["sync"]
run = [{ task = "docs-demo" }, "uv run --no-sync zensical serve"]

# ------------------------------------------------------------------ Swift rewrite (ADR 0018)
# AutoDJKit + the auto-dj CLI build with SwiftPM; the app with Xcode (project.yml ->
# AutoDJ.xcodeproj via XcodeGen, committed). These run beside the Go tasks until the
# cut-over (phase 8), when the Go tree goes and the CLI tasks above switch to the Swift CLI.

[tasks.swift-build]
description = "swift build (release) of AutoDJKit and the auto-dj CLI"
dir = "{{config_root}}"
run = "swift build --configuration release"

[tasks.swift-test]
description = "swift test (Swift Testing: synthetic tracks and checked-in fixtures)"
dir = "{{config_root}}"
run = "swift test"

[tasks.swift-cli]
description = "run the Swift auto-dj CLI with any arguments (mise run swift-cli -- --help)"
dir = "{{cwd}}"
run = 'swift build --package-path "{{config_root}}" --configuration release --product auto-dj && "$(swift build --package-path "{{config_root}}" --configuration release --show-bin-path)/auto-dj"'

[tasks.fmt-swift]
description = "swift format the Swift sources in place"
dir = "{{config_root}}"
run = "swift format format --in-place --recursive --parallel Package.swift Sources Tests App"

[tasks.lint-swift]
description = "swift format lint --strict over the Swift sources"
dir = "{{config_root}}"
run = "swift format lint --strict --recursive --parallel Package.swift Sources Tests App"

# Regenerate AutoDJ.xcodeproj from project.yml. The project is committed, so run this
# after editing project.yml or adding/removing app source files.
[tasks.gen]
description = "generate AutoDJ.xcodeproj from project.yml (XcodeGen)"
dir = "{{config_root}}"
run = "xcodegen generate --spec project.yml"

# The macOS app, unsigned (Developer ID signing and notarization happen on release).
[tasks.app-build]
description = "xcodebuild the AutoDJ app (needs Xcode)"
dir = "{{config_root}}"
run = """
xcodebuild build \
  -project AutoDJ.xcodeproj \
  -scheme AutoDJ \
  -destination 'generic/platform=macOS' \
  -derivedDataPath .build/xcode \
  CODE_SIGNING_ALLOWED=NO
"""

# A signed Debug build, launched. Signed so macOS's privacy grants (Documents, external
# drives) survive rebuilds: an unsigned build gets a new identity every time.
[tasks.app-run]
description = "build the AutoDJ app (signed, Debug) and launch it"
dir = "{{config_root}}"
run = """
xcodebuild build \
  -project AutoDJ.xcodeproj \
  -scheme AutoDJ \
  -destination 'generic/platform=macOS' \
  -derivedDataPath .build/xcode-signed \
  -allowProvisioningUpdates -quiet \
&& open .build/xcode-signed/Build/Products/Debug/AutoDJ.app
"""
